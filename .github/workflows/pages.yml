name: Deploy workspace dashboard to Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "scripts/build_dashboard.py"
      - "scripts/test_build_dashboard.py"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: bgnori/mahjong-domain-core
          ref: main
          path: mahjong-domain-core
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Test dashboard assembly
        run: python3 -m unittest discover -s scripts -p 'test_build_dashboard.py'
      - name: Assemble Pages site
        run: python3 scripts/build_dashboard.py _site --ci-assets mahjong-domain-core/scripts/ci-site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
